<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Поиск ближайших заведений и услуг</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: { 50: '#eef2ff', 100: '#e0e7ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-200 min-h-screen flex flex-col">

  <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
  <header id="app-header" class="hidden sticky top-0 z-30 bg-white/85 dark:bg-slate-900/85 backdrop-blur border-b border-slate-200 dark:border-slate-800">
    <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between gap-2">
      <div class="flex items-center gap-3 cursor-pointer min-w-0" onclick="navigate('home')">
        <div class="w-10 h-10 shrink-0 rounded-xl bg-gradient-to-br from-primary-500 to-indigo-700 text-white flex items-center justify-center shadow-sm">
          <!-- Иконка геолокации и поиска заведений -->
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z" />
          </svg>
        </div>
        <div class="truncate">
          <span class="font-bold text-sm block leading-tight truncate">Поиск ближайших заведений и услуг</span>
          <span id="header-role-badge" class="text-xs text-primary-600 dark:text-primary-400 font-medium"></span>
        </div>
      </div>
      <div class="flex items-center gap-1 sm:gap-2 shrink-0">
        <button onclick="navigate('home')" class="px-2.5 py-1.5 text-sm rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800">Главная</button>
        <button onclick="navigate('settings')" class="px-2.5 py-1.5 text-sm rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800">Настройки</button>
        <button onclick="logout()" class="px-2.5 py-1.5 text-sm rounded-lg text-rose-600 hover:bg-rose-50 dark:hover:bg-rose-950/50 font-medium">Выйти</button>
      </div>
    </div>
  </header>

  <!-- ОСНОВНОЙ КОНТЕЙНЕР -->
  <main id="app-root" class="flex-1 max-w-4xl w-full mx-auto px-4 py-8 flex flex-col justify-center"></main>

  <!-- МОДАЛЬНЫЕ ОКНА -->
  <div id="modal-backdrop" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div id="modal-box" class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl max-w-lg w-full p-6 shadow-xl max-h-[85vh] overflow-y-auto"></div>
  </div>

  <!-- TOAST УВЕДОМЛЕНИЯ -->
  <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 bg-slate-900 dark:bg-slate-800 text-white px-4 py-3 rounded-xl shadow-lg text-sm font-medium"></div>

  <script>
    // === ГЕНЕРАЦИЯ 100 ЗАВЕДЕНИЙ И УСЛУГ ===
    const PLACES_DATA = (() => {
      const baseTemplates = [
        { prefix: "Кофейня", names: ["Ботаника", "Зерно", "Утро", "Арабика", "Бариста", "Карамель", "Эспрессо", "Облако", "Тепло", "Крема"], cat: "Кофейня", desc: "Спешелти кофе, свежая выпечка и спокойная атмосфера для работы.", hours: "08:00 – 22:00" },
        { prefix: "Коворкинг", names: ["Квантум", "Точка Роста", "Сфера", "Офис Плюс", "Лофт", "Импульс", "Вектор", "Хаб", "Старт", "Прогресс"], cat: "Коворкинг", desc: "Высокоскоростной Wi-Fi, переговорные комнаты и безлимитный чай/кофе.", hours: "Круглосуточно" },
        { prefix: "Ресторан", names: ["Север", "Южный ветер", "Олива", "Традиция", "Базилик", "Панорама", "Гриль Хаус", "Маяк", "Мельница", "Сад"], cat: "Ресторан", desc: "Авторская и европейская кухня, бизнес-ланчи и уютный зал.", hours: "11:00 – 23:30" },
        { prefix: "Сервисный центр", names: ["ТехноМастер", "Чип и Плата", "РемБыт", "СмартФикс", "Электрон", "ГаджетСервис", "АйТи Помощь", "Вольт", "Мастерская №1", "Точный Ремонт"], cat: "Бытовые услуги", desc: "Срочный ремонт смартфонов, ноутбуков и бытовой техники с гарантией.", hours: "09:00 – 20:00" },
        { prefix: "Фитнес-клуб", names: ["Атлет", "Энергия", "Олимп", "Тонус", "Движение", "Спарта", "Формат", "Баланс", "Пульс", "Титан"], cat: "Спорт и здоровье", desc: "Тренажёрный зал, групповые программы, бассейн и сауна.", hours: "07:00 – 23:00" },
        { prefix: "Медцентр", names: ["Здоровье Плюс", "МедЛайн", "Доктор Рядом", "Вита", "Панацея", "Клиника Семьи", "БиоМед", "Эксперт", "АльфаМед", "Гармония"], cat: "Медицина", desc: "Консультации специалистов, лабораторная диагностика и УЗИ без очередей.", hours: "08:00 – 21:00" },
        { prefix: "Аптека", names: ["Фармация", "Зелёный Лист", "ЗдравСити", "Будь Здоров", "Аптека 24", "МедФарм", "Классика", "Витамин", "Надежда", "Забота"], cat: "Аптека", desc: "Широкий ассортимент лекарств, витаминов и товаров для здоровья.", hours: "Круглосуточно" },
        { prefix: "Автосервис", names: ["АвтоПрофи", "Мотор", "ШинМонтаж", "Драйв", "Колесо", "АвтоДоктор", "ПитСтоп", "Гараж №5", "Турбо", "КарСервис"], cat: "Автоуслуги", desc: "Компьютерная диагностика, замена масла, шиномонтаж и мойка.", hours: "08:30 – 21:00" },
        { prefix: "Салон красоты", names: ["Эстетика", "Шарм", "Стиль", "Грация", "Бьюти Лаб", "Локон", "Аура", "Модерн", "Силуэт", "Вдохновение"], cat: "Красота и уход", desc: "Стрижки, окрашивание, маникюр и косметологические услуги.", hours: "09:00 – 21:00" },
        { prefix: "Библиотека и центр", names: ["Им. Пушкина", "Горизонт", "Знание", "Открытый мир", "Академия", "Читальный зал", "Лекторий", "Культура", "Наследие", "Форум"], cat: "Культура и образование", desc: "Книжный фонд, бесплатные лекции, мастер-классы и тихие читальные зоны.", hours: "10:00 – 20:00" }
      ];

      const streets = ["ул. Ленина", "пр. Мира", "ул. Пушкина", "ул. Гагарина", "Набережная", "ул. Советская", "пр. Победы", "ул. Садовая", "ул. Центральная", "бул. Космонавтов"];
      const list = [];
      let idCounter = 1;

      for (let i = 0; i < 10; i++) {
        for (let t = 0; t < baseTemplates.length; t++) {
          const tpl = baseTemplates[t];
          const name = `${tpl.prefix} «${tpl.names[i]}»`;
          const street = streets[(idCounter * 3) % streets.length];
          const house = (idCounter % 95) + 1;
          const dist = (0.2 + ((idCounter * 17) % 48) / 10).toFixed(1);
          const rating = (4.3 + ((idCounter * 7) % 7) / 10).toFixed(1);

          list.push({
            id: idCounter,
            name,
            category: tpl.cat,
            rating,
            distance: `${dist} км`,
            address: `${street}, д. ${house}`,
            hours: tpl.hours,
            phone: `+7 (900) ${String(100 + idCounter).padStart(3, '0')}-${String(10 + (idCounter % 89))}-${String(20 + (idCounter % 79))}`,
            description: tpl.desc
          });
          idCounter++;
        }
      }
      return list;
    })();

    const BRAND_ICON_SVG = `
      <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z" />
      </svg>
    `;

    let state = {
      currentUser: null,
      isPinVerified: false,
      theme: localStorage.getItem('p12_theme') || 'system',
      favorites: JSON.parse(localStorage.getItem('p12_favs') || '[1, 2, 4]'),
      notes: JSON.parse(localStorage.getItem('p12_notes') || '[]'),
      searchQuery: '',
      onlyFavorites: false,
      visibleCount: 10,
      selectedPlaceId: null,
      postsCache: null
    };

    // === УТИЛИТЫ ===
    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.remove('translate-y-20', 'opacity-0');
      setTimeout(() => el.classList.add('translate-y-20', 'opacity-0'), 3000);
    }

    function applyTheme() {
      const root = document.documentElement;
      const isDark = state.theme === 'dark' || (state.theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      root.classList.toggle('dark', isDark);
    }

    function setTheme(mode) {
      state.theme = mode;
      localStorage.setItem('p12_theme', mode);
      applyTheme();
      navigate('settings');
    }

    function getRolePrefix(user) {
      const u = user.toLowerCase();
      if (u === 'admin') return 'admin';
      if (u === 'guard') return 'guard';
      return 'employee';
    }

    function logAuthAudit(event) {
      const logs = JSON.parse(localStorage.getItem('p12_auth_audit') || '[]');
      const ts = new Date().toLocaleString('ru-RU');
      logs.unshift(`[${ts}] ${event}`);
      localStorage.setItem('p12_auth_audit', JSON.stringify(logs));
    }

    function recordAccessAudit(userId, action, result, details) {
      const logs = JSON.parse(localStorage.getItem('p12_access_audit') || '[]');
      const ts = new Date().toLocaleString('ru-RU');
      const status = result ? 'ALLOWED' : 'DENIED';
      logs.unshift(`[${ts}] User: ${userId} | Action: ${action} | Result: ${status} | ${details}`);
      localStorage.setItem('p12_access_audit', JSON.stringify(logs));
    }

    // === АВТОРИЗАЦИЯ И PIN ===
    function handlePasswordLogin(e) {
      e.preventDefault();
      const user = document.getElementById('login-user').value.trim();
      const pass = document.getElementById('login-pass').value;
      if (!user) return showToast('Введите логин');

      const uLower = user.toLowerCase();
      let role = 'EMPLOYEE', roleLabel = 'Пользователь', expected = '24680';
      if (uLower === 'admin') { role = 'ADMIN'; roleLabel = 'Администратор'; expected = '12345'; }
      else if (uLower === 'guard') { role = 'SECURITY'; roleLabel = 'Охрана'; expected = '67890'; }

      if (pass !== expected) {
        logAuthAudit(`LOGIN_FAIL (password) for ${user}`);
        return showToast('Неверный пароль для выбранной роли');
      }

      state.currentUser = { userId: user, role, roleLabel };
      const savedPin = localStorage.getItem(`p12_pin_${getRolePrefix(user)}`);
      if (!savedPin) {
        state.isPinVerified = true;
        logAuthAudit(`LOGIN_SUCCESS for ${user} (${role})`);
        navigate('home');
      } else {
        state.isPinVerified = false;
        renderPinScreen();
      }
    }

    function handlePinSubmit(e) {
      e.preventDefault();
      const pin = document.getElementById('pin-input').value;
      const prefix = getRolePrefix(state.currentUser.userId);
      const savedPin = localStorage.getItem(`p12_pin_${prefix}`);
      if (pin === savedPin) {
        state.isPinVerified = true;
        logAuthAudit(`PIN_SUCCESS for ${state.currentUser.userId}`);
        navigate('home');
      } else {
        logAuthAudit(`PIN_FAIL for ${state.currentUser.userId}`);
        showToast('Неверный PIN-код');
      }
    }

    function logout() {
      if (state.currentUser) logAuthAudit(`LOGOUT ${state.currentUser.userId}`);
      state.currentUser = null;
      state.isPinVerified = false;
      document.getElementById('app-header').classList.add('hidden');
      renderLoginScreen();
    }

    // === НАВИГАЦИЯ И ЭКРАНЫ ===
    function navigate(screen, param = null) {
      if (!state.currentUser) return renderLoginScreen();
      if (!state.isPinVerified) return renderPinScreen();

      document.getElementById('app-header').classList.remove('hidden');
      document.getElementById('header-role-badge').textContent = `${state.currentUser.userId} · ${state.currentUser.roleLabel}`;

      const root = document.getElementById('app-root');
      root.classList.remove('justify-center');

      if (screen === 'home') renderHomeScreen(root);
      else if (screen === 'list') renderListScreen(root);
      else if (screen === 'place_detail') {
        state.selectedPlaceId = param;
        renderPlaceDetailScreen(root, param);
      }
      else if (screen === 'posts') renderPostsScreen(root);
      else if (screen === 'settings') renderSettingsScreen(root);
      else if (screen === 'pass') renderPassScreen(root);
      else if (screen === 'scan') renderScanScreen(root);
      else if (screen === 'admin') renderAdminScreen(root);
      else if (screen === 'security_lab') renderSecurityLabScreen(root);
    }

    function renderLoginScreen() {
      const root = document.getElementById('app-root');
      root.classList.add('justify-center');
      root.innerHTML = `
        <div class="max-w-md w-full mx-auto bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-8 shadow-sm">
          <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-primary-500 to-indigo-700 text-white flex items-center justify-center mb-5 shadow-sm">
            ${BRAND_ICON_SVG}
          </div>
          <h1 class="text-xl font-bold mb-1">Поиск ближайших заведений и услуг</h1>
          <p class="text-sm text-slate-500 dark:text-slate-400 mb-6">Войдите в систему, используя учётные данные вашей роли</p>
          <form onsubmit="handlePasswordLogin(event)" class="space-y-4">
            <div>
              <label class="block text-sm font-medium mb-1">Логин</label>
              <input id="login-user" type="text" placeholder="admin, guard или Иван" required
                class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-transparent focus:ring-2 focus:ring-primary-500 outline-none" />
            </div>
            <div>
              <label class="block text-sm font-medium mb-1">Пароль</label>
              <input id="login-pass" type="password" placeholder="•••••" required
                class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-transparent focus:ring-2 focus:ring-primary-500 outline-none" />
            </div>
            <button type="submit" class="w-full py-3 rounded-xl bg-primary-600 hover:bg-primary-700 text-white font-semibold transition">Войти</button>
          </form>
          <div class="mt-6 pt-5 border-t border-slate-100 dark:border-slate-800 text-xs text-slate-500 space-y-1">
            <div><strong class="text-slate-700 dark:text-slate-300">Администратор:</strong> admin / 12345</div>
            <div><strong class="text-slate-700 dark:text-slate-300">Охрана:</strong> guard / 67890</div>
            <div><strong class="text-slate-700 dark:text-slate-300">Сотрудник:</strong> Иван / 24680</div>
          </div>
        </div>
      `;
    }

    function renderPinScreen() {
      const root = document.getElementById('app-root');
      root.classList.add('justify-center');
      root.innerHTML = `
        <div class="max-w-sm w-full mx-auto bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-8 shadow-sm text-center">
          <h2 class="text-xl font-bold mb-2">Введите PIN-код</h2>
          <p class="text-sm text-slate-500 mb-6">Пользователь: <strong>${state.currentUser.userId}</strong></p>
          <form onsubmit="handlePinSubmit(event)" class="space-y-4">
            <input id="pin-input" type="password" maxlength="4" pattern="\\d{4}" placeholder="••••" required
              class="w-full text-center tracking-[1em] text-2xl font-bold py-3 rounded-xl border border-slate-300 dark:border-slate-700 bg-transparent outline-none focus:ring-2 focus:ring-primary-500" />
            <button type="submit" class="w-full py-3 rounded-xl bg-primary-600 hover:bg-primary-700 text-white font-semibold">Подтвердить</button>
          </form>
          <button onclick="logout()" class="mt-4 text-sm text-slate-500 hover:text-slate-700">Сменить пользователя</button>
        </div>
      `;
    }

    // 1. ГЛАВНЫЙ ЭКРАН
    function renderHomeScreen(root) {
      root.innerHTML = `
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 sm:p-8 mb-6 shadow-sm">
          <span class="inline-block px-3 py-1 rounded-full text-xs font-semibold bg-primary-50 text-primary-700 dark:bg-primary-500/10 dark:text-primary-400 mb-3">
            Роль: ${state.currentUser.roleLabel} (${state.currentUser.role})
          </span>
          <h1 class="text-2xl sm:text-3xl font-bold mb-2">Добро пожаловать, ${state.currentUser.userId}!</h1>
          <p class="text-slate-500 dark:text-slate-400 text-sm">Поиск ближайших заведений и услуг. Служебные инструменты вашей роли и руководство пользователя находятся в настройках.</p>
        </div>

        <div class="grid sm:grid-cols-3 gap-4">
          <button onclick="navigate('list')" class="text-left p-6 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 hover:border-primary-500 transition shadow-sm group">
            <div class="w-10 h-10 rounded-xl bg-indigo-50 dark:bg-indigo-500/10 text-indigo-600 flex items-center justify-center text-xl mb-4">📍</div>
            <h3 class="font-bold text-lg mb-1 group-hover:text-primary-600">Список заведений</h3>
            <p class="text-sm text-slate-500">100 мест и услуг рядом, поиск и избранное</p>
          </button>

          <button onclick="navigate('posts')" class="text-left p-6 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 hover:border-primary-500 transition shadow-sm group">
            <div class="w-10 h-10 rounded-xl bg-emerald-50 dark:bg-emerald-500/10 text-emerald-600 flex items-center justify-center text-xl mb-4">🌐</div>
            <h3 class="font-bold text-lg mb-1 group-hover:text-primary-600">Обзор (Посты API)</h3>
            <p class="text-sm text-slate-500">Лента публикаций и отзывов с сервера</p>
          </button>

          <button onclick="navigate('settings')" class="text-left p-6 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 hover:border-primary-500 transition shadow-sm group">
            <div class="w-10 h-10 rounded-xl bg-amber-50 dark:bg-amber-500/10 text-amber-600 flex items-center justify-center text-xl mb-4">⚙️</div>
            <h3 class="font-bold text-lg mb-1 group-hover:text-primary-600">Настройки</h3>
            <p class="text-sm text-slate-500">Тема, безопасность, пропуск и руководство</p>
          </button>
        </div>
      `;
    }

    // 2. СПИСОК ЗАВЕДЕНИЙ (Без потери фокуса при вводе + 100 штук + Загрузить ещё)
    function toggleFav(id, e) {
      if (e) e.stopPropagation();
      if (state.favorites.includes(id)) state.favorites = state.favorites.filter(x => x !== id);
      else state.favorites.push(id);
      localStorage.setItem('p12_favs', JSON.stringify(state.favorites));

      if (document.getElementById('places-list-container')) {
        updatePlacesListOnly();
      } else if (state.selectedPlaceId === id) {
        renderPlaceDetailScreen(document.getElementById('app-root'), id);
      }
    }

    function handleSearchInput(val) {
      state.searchQuery = val;
      state.visibleCount = 10;
      const clearBtn = document.getElementById('search-clear-btn');
      if (clearBtn) clearBtn.classList.toggle('hidden', val.length === 0);
      updatePlacesListOnly();
    }

    function clearSearchInput() {
      state.searchQuery = '';
      state.visibleCount = 10;
      const input = document.getElementById('places-search-input');
      if (input) {
        input.value = '';
        input.focus();
      }
      const clearBtn = document.getElementById('search-clear-btn');
      if (clearBtn) clearBtn.classList.add('hidden');
      updatePlacesListOnly();
    }

    function loadMorePlaces() {
      state.visibleCount += 10;
      updatePlacesListOnly();
    }

    function renderListScreen(root) {
      root.innerHTML = `
        <div class="flex items-center justify-between mb-6">
          <div>
            <h2 class="text-2xl font-bold">Заведения и услуги рядом</h2>
            <p class="text-xs text-slate-500 mt-0.5">Нажмите на карточку, чтобы открыть профиль заведения и заметки</p>
          </div>
          <button onclick="navigate('home')" class="text-sm text-primary-600 font-medium shrink-0">← На главную</button>
        </div>

        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 mb-6 space-y-4">
          <div class="relative">
            <input id="places-search-input" type="text" value="${state.searchQuery.replace(/"/g, '&quot;')}"
              oninput="handleSearchInput(this.value)"

    function updatePlacesListOnly() {
      const container = document.getElementById('places-list-container');
      const counter = document.getElementById('places-counter');
      if (!container) return;

      const q = state.searchQuery.trim().toLowerCase();
      const filtered = PLACES_DATA.filter(p => {
        const matchQ = !q || p.name.toLowerCase().includes(q) || p.category.toLowerCase().includes(q) || p.address.toLowerCase().includes(q);
        const matchFav = state.onlyFavorites ? state.favorites.includes(p.id) : true;
        return matchQ && matchFav;
      });

      const slice = filtered.slice(0, state.visibleCount);
      if (counter) {
        counter.textContent = `Показано ${slice.length} из ${filtered.length}`;
      }

      if (slice.length === 0) {
        container.innerHTML = `
          <div class="text-center py-12 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl">
            <p class="text-slate-500 text-sm">По вашему запросу ничего не найдено.</p>
          </div>
        `;
        return;
      }

      const cardsHtml = slice.map(p => {
        const isFav = state.favorites.includes(p.id);
        const placeNotesCount = state.notes.filter(n => n.placeId === p.id).length;
        return `
          <div onclick="navigate('place_detail', ${p.id})"
            class="cursor-pointer bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 hover:border-primary-500 rounded-2xl p-5 flex items-center justify-between gap-4 transition shadow-sm group">
            <div class="min-w-0">

                <span class="text-xs font-medium px-2.5 py-0.5 rounded-full bg-slate-100 dark:bg-slate-800">${p.category}</span>
                <span class="text-xs text-amber-500 font-semibold">★ ${p.rating}</span>
                <span class="text-xs text-primary-600 dark:text-primary-400 font-medium">📍 ${p.distance}</span>
                ${placeNotesCount > 0 ? `<span class="text-xs px-2 py-0.5 rounded-full bg-indigo-50 dark:bg-indigo-500/10 text-indigo-600 dark:text-indigo-400">📝 Заметок: ${placeNotesCount}</span>` : ''}
              </div>
              <h3 class="font-bold text-lg group-hover:text-primary-600 transition truncate">${p.name}</h3>
              <p class="text-sm text-slate-500 truncate">${p.address} · ${p.hours}</p>
            </div>
            <button onclick="toggleFav(${p.id}, event)" title="В избранное"
              class="p-3 shrink-0 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 text-lg transition">
              ${isFav ? '❤️' : '🤍'}
            </button>
          </div>
        `;
      }).join('');

      const loadMoreHtml = slice.length < filtered.length ? `
        <div class="pt-4 text-center">
          <button onclick="loadMorePlaces()"
            class="px-6 py-3 rounded-xl bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 hover:border-primary-500 text-sm font-semibold shadow-sm transition">
            Загрузить ещё (осталось ${filtered.length - slice.length})
          </button>
        </div>
      ` : '';

      container.innerHTML = `<div class="space-y-3">${cardsHtml}</div>${loadMoreHtml}`;
    }

    function addPlaceNote(e, placeId) {

      if (!title || !body) return;

      state.notes.unshift({
        id: Date.now(),
        placeId,
        placeName: place ? place.name : 'Общая заметка',
        title,
        body,
        updatedAt: new Date().toLocaleString('ru-RU')
      });
      localStorage.setItem('p12_notes', JSON.stringify(state.notes));
      showToast('Заметка сохранена');
      renderPlaceDetailScreen(document.getElementById('app-root'), placeId);
    }

    function deletePlaceNote(noteId, placeId) {
      state.notes = state.notes.filter(n => n.id !== noteId);

      renderPlaceDetailScreen(document.getElementById('app-root'), placeId);

    // 6. ТЕСТЫ ЛАБОРАТОРНОЙ 15
    async function renderSecurityLabScreen(root) {
      root.innerHTML = `
        <div class="flex items-center justify-between mb-6">
          <h2 class="text-2xl font-bold">SecurityLabTest (Лаб. 15)</h2>
          <button onclick="navigate('settings')" class="text-sm text-primary-600 font-medium">← В настройки</button>
        </div>
        <div id="lab-console" class="bg-slate-900 text-emerald-400 font-mono text-xs p-6 rounded-2xl space-y-2 overflow-x-auto leading-relaxed">
          <div>=== НАЧАЛО ТЕСТИРОВАНИЯ БЕЗОПАСНОСТИ ===</div>
        </div>
      `;
      const logLine = (txt) => {
        const el = document.getElementById('lab-console');
        if (el) el.innerHTML += `<div>${txt}</div>`;
      };

      const enc = new TextEncoder();
      const key = await crypto.subtle.importKey('raw', enc.encode('secret'), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
      const canonical = `POST\n/api/v1/data\nsha256_body_hash\n1700000000\n123e4567-e89b-12d3-a456-426614174000`;
      const sigBuf = await crypto.subtle.sign('HMAC', key, enc.encode(canonical));
      const sigHex = Array.from(new Uint8Array(sigBuf)).map(b => b.toString(16).padStart(2, '0')).join('');
      logLine(`1. HMAC-Подпись: ${sigHex}`);

      const seen = new Set();
      const checkNonce = (n, ts) => (Math.abs(Math.floor(Date.now()/1000) - ts) <= 60) && !seen.has(n) && !!seen.add(n);
      const now = Math.floor(Date.now() / 1000);
      logLine(`2. Nonce-кэш: первая попытка = ${checkNonce('nonce_123', now)}, повтор = ${checkNonce('nonce_123', now)}, старый ts = ${checkNonce('nonce_456', now - 100)}`);

      try {
        const r = await fetch('https://jsonplaceholder.typicode.com/posts?_limit=5');
        const data = await r.json();
        logLine(`3. Защищённый HTTPS-запрос: Успех! Получено записей: ${data.length}`);
      } catch (e) {
        logLine(`3. Ошибка сети: ${e.message}`);
      }
    }

    function saveNewPin() {
      const val = document.getElementById('new-pin-val').value;
      if (!/^\d{4}$/.test(val)) return showToast('Введите ровно 4 цифры');
      const prefix = getRolePrefix(state.currentUser.userId);
      localStorage.setItem(`p12_pin_${prefix}`, val);
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      const recovery = Array.from({ length: 8 }, () => chars[Math.floor(Math.random() * chars.length)]).join('');
      logAuthAudit(`PIN_SET for ${state.currentUser.userId}`);
      document.getElementById('modal-box').innerHTML = `
        <h3 class="text-lg font-bold mb-2">PIN сохранён!</h3>
        <p class="text-sm text-slate-500 mb-3">Ваш одноразовый код восстановления:</p>
        <div class="p-3 rounded-xl bg-slate-100 dark:bg-slate-800 font-mono text-xl font-bold text-center text-primary-600 mb-4">${recovery}</div>
        <button onclick="closeModal(); navigate('settings')" class="w-full py-2.5 rounded-xl bg-primary-600 text-white font-medium">Я сохранил</button>
      `;
    }

    function openAuthLogModal() {
      const logs = JSON.parse(localStorage.getItem('p12_auth_audit') || '[]');
      document.getElementById('modal-box').innerHTML = `
        <h3 class="text-lg font-bold mb-3">Журнал событий входа</h3>
        <div class="max-h-60 overflow-y-auto space-y-1.5 text-xs font-mono mb-4">
          ${logs.length ? logs.map(l => `<div class="p-2 rounded bg-slate-100 dark:bg-slate-800">${l}</div>`).join('') : 'Журнал пуст'}
        </div>
        <button onclick="closeModal()" class="w-full py-2 rounded-xl bg-primary-600 text-white text-sm font-medium">Закрыть</button>
      `;
      document.getElementById('modal-backdrop').classList.remove('hidden');
    }

    function openUserGuideModal() {
      document.getElementById('modal-box').innerHTML = `
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-xl font-bold">📖 Руководство пользователя</h3>
          <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-lg font-bold">✕</button>
        </div>

        <div class="space-y-4 text-sm text-slate-600 dark:text-slate-300 leading-relaxed">
          <div class="p-3.5 rounded-xl bg-slate-50 dark:bg-slate-800/70">
            <h4 class="font-bold text-slate-900 dark:text-white mb-1">1. Ролевая модель доступа (RBAC)</h4>
            <ul class="list-disc pl-5 space-y-1 text-xs">
              <li><strong>Администратор (admin / 12345):</strong> полный доступ к «Журналу доступа (Audit)» и просмотру событий сканирования.</li>
              <li><strong>Охрана (guard / 67890):</strong> доступ к «Сканеру пропусков» для проверки посетителей.</li>
              <li><strong>Сотрудник (любой логин / 24680):</strong> доступ к личному мобильному пропуску, списку заведений и заметкам.</li>
            </ul>
          </div>

          <div>
            <h4 class="font-bold text-slate-900 dark:text-white mb-1">2. Поиск заведений и профили объектов</h4>
            <p class="text-xs">В каталоге доступно <strong>100 заведений и услуг</strong>. Используйте строку поиска по названию, категории или адресу, а также фильтр «Только избранное». Нажмите на любую карточку, чтобы открыть профиль заведения с контактами, часами работы и формой для личных заметок.</p>
          </div>

          <div>
            <h4 class="font-bold text-slate-900 dark:text-white mb-1">3. Персональный PIN-код и безопасность</h4>
            <p class="text-xs">В настройках можно задать индивидуальный 4-значный PIN-код для каждой роли. При установке система сгенерирует одноразовый 8-значный код восстановления. Все входы записываются в журнал аудита.</p>
          </div>

          <div>
            <h4 class="font-bold text-slate-900 dark:text-white mb-1">4. Проверка пропусков и тестирование защиты</h4>
            <p class="text-xs">Охранник выполняет проверку в разделе «Сканер пропусков», после чего запись автоматически появляется у администратора в «Журнале доступа». В разделе «Тесты сетевой безопасности» можно запустить проверку HMAC-SHA256 подписи и защиты от повторных запросов (NonceCache).</p>
          </div>
        </div>

        <button onclick="closeModal()" class="mt-6 w-full py-2.5 rounded-xl bg-primary-600 hover:bg-primary-700 text-white text-sm font-semibold">Понятно, закрыть</button>
      `;
      document.getElementById('modal-backdrop').classList.remove('hidden');
    }

    // Инициализация
    applyTheme();
    renderLoginScreen();
  </script>
</body>
</html>
